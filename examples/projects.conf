# cc-whereis — project map
#
# Copy to:  ~/.config/cc-whereis/projects.conf
#           (or $XDG_CONFIG_HOME/cc-whereis/projects.conf if you set that)
#
# Format, in full:
#
#   [name]                     the label you call the project by. Must be unique.
#   path    = ...              required. Absolute, or starting with ~/
#   aliases = a, b, c          optional. Other names for the same project.
#   tags    = x, y             optional. Free-form grouping.
#
# Values are literal to the end of the line and get trimmed. There is no
# quoting and there are no escapes — so Windows paths just work. A line whose
# first non-space character is # is a comment; a # anywhere else is part of
# the value.

[dashboard]
path    = ~/code/acme-dashboard
aliases = explore, analytics-ui
tags    = frontend, work

[api]
path    = ~/code/acme-api
aliases = backend, core-api
tags    = backend, work

[notes]
path = C:\Users\you\Documents\notes
tags = personal

[dotfiles]
path = ~/dotfiles
